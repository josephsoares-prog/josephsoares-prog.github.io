<style>
  :root{
    --ink:#0A3161; --panel:#0E3A70; --panel2:#072244;
    --bone:#F2EFE9; --muted:#A9A39A; --gold:#D4AF37; --line:rgba(242,239,233,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;overflow-x:hidden}
  body{background:var(--ink);color:var(--bone);font-family:'EB Garamond',Georgia,serif;
    font-size:19px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;max-width:100vw;
    background-image:radial-gradient(ellipse 120% 70% at 50% -8%, rgba(201,162,39,.07), rgba(0,0,0,0));}
  img,iframe{max-width:100%}
  .wrap{max-width:1120px;margin:0 auto;padding:0 30px}
  .eyebrow{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.3em;
    font-size:13px;font-weight:500;color:var(--gold)}
  a{color:inherit}
  .btn{display:inline-block;font-family:'Oswald',sans-serif;text-transform:uppercase;
    letter-spacing:.14em;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;
    padding:18px 34px;border-radius:2px;transition:.2s;border:1px solid transparent}
  .btn-gold{background:var(--gold);color:#0E3A70}
  .btn-gold:hover{background:#E6C860}
  .btn-ghost{background:transparent;color:var(--bone);border-color:var(--line)}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold)}

  nav{position:sticky;top:0;z-index:20;background:rgba(7,34,68,.90);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px}
  .brand{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.2em;font-weight:600;font-size:16px}
  .brand span{color:var(--gold)}
  .navlinks{display:flex;gap:30px;align-items:center}
  .navlinks a{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.12em;
    font-size:13px;font-weight:500;text-decoration:none;color:var(--muted)}
  .navlinks a:hover{color:var(--gold)}
  .navlinks a.cta{color:var(--bone);border:1px solid var(--line);padding:9px 16px;border-radius:2px}
  .navlinks a.cta:hover{border-color:var(--gold);color:var(--gold)}
  .menutoggle{display:none}
  .navdrop{position:relative}
  .navdrop-menu{display:none;position:absolute;top:100%;left:0;background:var(--panel2);
    border:1px solid var(--line);border-radius:3px;padding:10px 0;min-width:150px;z-index:30}
  .navdrop:hover .navdrop-menu,.navdrop:focus-within .navdrop-menu{display:block}
  .navdrop-menu a{display:block;padding:8px 18px;white-space:nowrap}

  .back{padding:26px 0 0}
  .back a{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:12px;
    font-weight:600;color:var(--muted);text-decoration:none}
  .back a:hover{color:var(--gold)}

  .hero{padding:22px 0 44px;position:relative}
  .hero .tag{display:inline-block;font-family:'Oswald',sans-serif;text-transform:uppercase;
    letter-spacing:.16em;font-size:11.5px;font-weight:600;color:var(--gold);border:1px solid rgba(212,175,55,.4);
    border-radius:100px;padding:5px 14px;margin-bottom:18px}
  .hero h1{font-family:'Oswald',sans-serif;text-transform:uppercase;font-weight:600;
    font-size:52px;line-height:1.05;letter-spacing:.005em;max-width:20ch;margin-bottom:16px}
  .updated{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--muted)}
  .updated b{color:var(--gold)}

  .blk{padding:10px 0 60px}
  .article p{font-size:18px;color:var(--bone);margin-bottom:16px;max-width:760px}
  .article p b{color:var(--gold);font-weight:600}
  .article h4{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.12em;
    font-size:13px;font-weight:600;color:var(--gold);margin:28px 0 12px}
  .article h4:first-of-type{margin-top:8px}
  .src{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.04em;color:var(--muted);line-height:1.8;margin-top:20px;max-width:760px;
    border-top:1px solid var(--line);padding-top:18px}
  .src a{color:var(--muted);text-decoration:underline}
  .src a:hover{color:var(--gold)}

  .method{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);padding:28px 0;margin-top:20px}
  .method p{font-size:15.5px;color:var(--muted);font-style:italic;max-width:80ch}

  .teaser-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px;margin-top:10px}
  .teaser-card{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:28px 26px;
    display:flex;flex-direction:column}
