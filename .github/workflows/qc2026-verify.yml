name: qc2026-verify

on:
  pull_request:
    paths:
      - 'quebec2026/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Diff touches nothing outside quebec2026/
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "not a pull request; skipping diff scope check"
            exit 0
          fi
          git fetch origin "$GITHUB_BASE_REF" --quiet
          changed=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")
          echo "changed files:"; echo "$changed"
          outside=$(echo "$changed" | grep -v '^quebec2026/' | grep -v '^$' || true)
          if [ -n "$outside" ]; then
            echo "FAILED: this PR touches files outside quebec2026/:"
            echo "$outside"
            exit 1
          fi

      - name: Poll input checks
        run: python3 quebec2026/check_polls.py

      - name: Recompute projection
        run: python3 quebec2026/daily.py

      - name: Output checks
        run: |
          out=$(python3 quebec2026/verify.py)
          echo "$out"
          echo "$out" | grep -q 'checks passed' || {
            echo "FAILED: verify.py did not report 'checks passed'"; exit 1; }

      - name: Recompute is deterministic
        run: |
          a=$(python3 quebec2026/verify.py)
          python3 quebec2026/daily.py >/dev/null
          b=$(python3 quebec2026/verify.py)
          if [ "$a" != "$b" ]; then
            echo "FAILED: projection is not reproducible"
            echo "first:  $a"
            echo "second: $b"
            exit 1
          fi
          echo "reproducible: $b"
