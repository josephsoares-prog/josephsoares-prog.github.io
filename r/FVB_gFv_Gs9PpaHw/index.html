<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Private</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A3161;--panel:#0E3A70;--deep:#072244;--gold:#D4AF37;--gold2:#E6C860;--cream:#F2EFE9;--muted:#A9A39A;--line:rgba(242,239,233,.12)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--deep);color:var(--cream);font-family:"EB Garamond",Georgia,serif;font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:28px 16px 48px}
h1,h2,h3,.eyebrow,button,.cta{font-family:Oswald,"Arial Narrow",sans-serif;letter-spacing:.02em}
h1{font-size:clamp(34px,8vw,52px);margin:4px 0 6px;line-height:1.05;text-transform:uppercase}
h2{font-size:18px;text-transform:uppercase;color:var(--gold);margin:0 0 14px;font-weight:600;letter-spacing:.08em}
h3{font-size:17px;margin:0 0 2px;font-weight:500}
.eyebrow{color:var(--gold);text-transform:uppercase;font-size:14px;letter-spacing:.14em;margin:0}
.sub,.meta,.note{color:var(--muted)}
.meta{margin:0 0 8px;font-size:16px}
.note{font-size:16px;margin:12px 0 0}
.contact a,a{color:var(--gold)}
a:hover{color:var(--gold2)}
.hero{padding:12px 0 20px;border-bottom:1px solid var(--line);margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 18px;margin:0 0 16px}
ul{padding-left:20px;margin:0}
li{margin:0 0 8px}
.results strong{color:#fff}
.role{padding:10px 0;border-top:1px solid var(--line)}
.role:first-child{border-top:0;padding-top:0}
.video{position:relative;width:100%;aspect-ratio:16/9;background:var(--deep);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.pending{color:var(--muted);text-align:center;padding:0 16px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
button,.cta{flex:1 1 200px;min-height:48px;border-radius:8px;font-size:16px;text-transform:uppercase;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
button{background:transparent;color:var(--cream);border:1px solid var(--gold)}
.cta{background:var(--gold);color:var(--deep);border:0}
.cta:hover{background:var(--gold2);color:var(--deep)}
.playbtn{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0;padding:0;background:#000 center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--cream);text-transform:uppercase}
.playicon{width:72px;height:72px;border-radius:50%;background:var(--gold);color:var(--deep);display:flex;align-items:center;justify-content:center;font-size:28px;padding-left:5px;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.playlabel{background:rgba(7,34,68,.8);padding:4px 10px;border-radius:4px;font-size:14px;letter-spacing:.08em}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.photos figure{margin:0}
.photos img{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:center top;border-radius:8px;display:block}
.photos figcaption{font-size:14px;line-height:1.35;color:var(--muted);margin-top:6px}
@media (max-width:420px){.photos{grid-template-columns:1fr}}
.book{display:flex;gap:14px;align-items:flex-start}
.book img{width:96px;flex:0 0 96px;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.role p{margin:0 0 8px}
#lock{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted)}
#lock p{max-width:420px}
@media print{
  body{background:#fff;color:#000;font-size:11pt}
  main{padding:0}
  .card{background:#fff;border:0;padding:6px 0;margin:0}
  .hero{border-color:#ccc}
  h2,.eyebrow,a{color:#0A3161}
  .sub,.meta,.note{color:#444}
  .results strong{color:#000}
  .role{border-color:#ddd}
  .video,.actions,#video-card,.photos,.book img{display:none}
  .card,.role{break-inside:avoid;page-break-inside:avoid}
  h2,h3{break-after:avoid;page-break-after:avoid}
  .print-page2{break-before:page;page-break-before:always}
}
</style>
</head>
